fullnameOverride: otel-collector
mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

extraEnvs:
  - name: DASH0_AUTHORIZATION_TOKEN
    valueFrom:
      secretKeyRef:
        name: dash0-secrets
        key: dash0-authorization-token
  - name: DASH0_ENDPOINT_OTLP_GRPC_HOSTNAME
    valueFrom:
      secretKeyRef:
        name: dash0-secrets
        key: dash0-grpc-hostname
  - name: DASH0_ENDPOINT_OTLP_GRPC_PORT
    valueFrom:
      secretKeyRef:
        name: dash0-secrets
        key: dash0-grpc-port
  - name: DASH0_DATASET
    valueFrom:
      secretKeyRef:
        name: dash0-secrets
        key: dash0-dataset
  - name: OPENSEARCH_USERNAME
    value: admin
  - name: OPENSEARCH_PASSWORD
    value: SecureP@ssw0rd123  

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["nodes/proxy"]
      verbs: ["get"]
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list"]

presets:
  logsCollection:
    enabled: true
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
    extractAllPodAnnotations: true
  kubeletMetrics:
    enabled: true
  hostMetrics:
    enabled: true

service:
  enabled: true

config:
  receivers:
    otlp:
      protocols:
        grpc: {}
        http: {}
    kubeletstats:
      insecure_skip_verify: true
      metrics:
        container.cpu.usage:
          enabled: true
        k8s.node.cpu.usage:
          enabled: true
        k8s.pod.cpu.usage:
          enabled: true
        k8s.pod.cpu_limit_utilization:
          enabled: true
        k8s.pod.cpu_request_utilization:
          enabled: true
        k8s.pod.memory_limit_utilization:
          enabled: true
        k8s.pod.memory_request_utilization:
          enabled: true

  processors:
    batch: {}
    resourcedetection:
      detectors:
        # note: later detectors override attributes provided by earlier detectors
        - system
        - ec2
        - eks
        - ecs
        - gcp
        - azure
        - aks
        - k8snode
      timeout: 2s
      system:
        resource_attributes:
          host.name:
            # Do not collect host.name via system resource detector, as this would result in the podname being set as the
            # hostname, see https://kubernetes.io/docs/concepts/containers/container-environment/#container-information.
            enabled: false

    # OpenSearch-only compatibility shim. Do NOT add this to the Dash0 pipeline.
    #
    # OpenSearch splits attribute names on dots into nested objects, so a pod
    # labelled `app` and a pod labelled `app.kubernetes.io/name` both map to
    # `resource.app` -- once as a value, once as an object. Whichever indexes
    # first wins the dynamic mapping and the other is rejected forever with
    # mapper_parsing_exception, silently dropping those pods' logs.
    #
    # Dash0 has no such problem, so the fix is scoped to the OpenSearch branch
    # rather than degrading what we extract. Only the bare prefix key needs to
    # go; the namespaced `app.kubernetes.io/*` labels are kept. Third-party
    # charts using a bare `app` label (cert-manager, kindnet,
    # local-path-provisioner) are what make this necessary.
    #
    # If a new collision appears, add the offending bare key here.
    resource/opensearch-compat:
      attributes:
        - action: delete
          key: app

  connectors:
    # Tees the enriched logs stream into the OpenSearch pipeline, so that branch
    # inherits every receiver and processor the chart's presets add above.
    forward/opensearch: {}

  exporters:
    otlp/dash0:
      auth:
        authenticator: bearertokenauth/dash0
      endpoint: ${env:DASH0_ENDPOINT_OTLP_GRPC_HOSTNAME}:${env:DASH0_ENDPOINT_OTLP_GRPC_PORT}
      headers:
        Dash0-Dataset: ${env:DASH0_DATASET}

    otlphttp/prometheus:
      endpoint: http://prometheus.default.svc.cluster.local:9090/api/v1/otlp
      tls:
        insecure: true

    otlp/jaeger:
      endpoint: jaeger-collector.default.svc.cluster.local:4317 
      tls:
        insecure: true

    opensearch/log:
      http:
        endpoint: https://opensearch-cluster-master.default.svc.cluster.local:9200
        tls:
          insecure_skip_verify: true
        auth:
          authenticator: basicauth/client

  extensions:
    bearertokenauth/dash0:
      scheme: Bearer
      token: ${env:DASH0_AUTHORIZATION_TOKEN}
    basicauth/client:
      client_auth:
        username: ${env:OPENSEARCH_USERNAME}
        password: ${env:OPENSEARCH_PASSWORD}

  service:
    extensions:
      - bearertokenauth/dash0
      - basicauth/client
      - health_check
    pipelines:
      metrics:
        receivers: [otlp, kubeletstats]
        processors: [resourcedetection, batch]
        exporters: [otlp/dash0, otlphttp/prometheus]
      traces:
        receivers: [otlp]
        processors: [resourcedetection, batch]
        exporters: [otlp/dash0, otlp/jaeger]
      # Dash0 gets the full resource, including every pod label and annotation.
      # The chart's presets inject extra receivers (filelog) and processors
      # (k8s_attributes) into this pipeline, so it stays the primary one. The
      # OpenSearch branch is fed from it through the forward connector rather
      # than re-declaring those components, which would silently drift the day
      # the chart changes what it injects.
      logs:
        receivers: [otlp]
        processors: [resourcedetection, batch]
        exporters: [otlp/dash0, forward/opensearch]
      # Same enriched logs, minus the keys OpenSearch cannot map.
      logs/opensearch:
        receivers: [forward/opensearch]
        processors: [resource/opensearch-compat]
        exporters: [opensearch/log]
