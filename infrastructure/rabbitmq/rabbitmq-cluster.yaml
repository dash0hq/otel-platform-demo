apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  namespace: default
spec:
  # Single replica for demo
  replicas: 1

  # Image configuration
  # Needs RabbitMQ 4.x: the cluster operator's default startup probe hits
  # /api/health/checks/reached-target-cluster-size, which 3.13 does not serve.
  image: rabbitmq:4-management

  # Resource limits
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "256Mi"

  # Persistence configuration
  persistence:
    storageClassName: standard
    storage: "2Gi"

  # RabbitMQ configuration
  rabbitmq:
    additionalPlugins:
      - rabbitmq_management
      - rabbitmq_prometheus

    additionalConfig: |
      # Memory configuration
      vm_memory_high_watermark.relative = 0.6

      # Disk free space
      disk_free_limit.relative = 2.0

      # Allow guest user from any host
      loopback_users.guest = false

      # Default user
      default_user = guest
      default_pass = guest

  # Service configuration
  service:
    type: ClusterIP
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "15692"
