singleNode: true

# No image.tag override on purpose: the chart's appVersion is the single source of
# truth, so the image tracks the chart instead of drifting behind it.

extraEnvs:
  - name: discovery.type
    value: single-node
  - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
    value: SecureP@ssw0rd123

resources:
  limits:
    memory: 2Gi
    cpu: "1"

persistence:
  enabled: false

service:
  type: NodePort
  ports:
    restAPI: 9200
