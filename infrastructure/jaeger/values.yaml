# Jaeger v2 (chart 4.x). The v1 layout -- allInOne / agent / collector / query as
# separate top-level keys -- no longer exists. v2 is a single binary configured like
# an OpenTelemetry Collector, and the chart exposes it under `jaeger`.
#
# The chart creates a single Service named `jaeger` carrying every port. The v1
# split services (jaeger-collector, jaeger-query, jaeger-agent) are gone, so
# anything addressing those names must use `jaeger` instead.
#
# `storage.type` has no effect on this path -- storage is declared in the config
# below. In-memory is what the demo wants, since the cluster is recreated for
# every run.
fullnameOverride: jaeger

jaeger:
  image:
    # Jaeger's own registry is what the upstream docs use; it also keeps the demo
    # off Docker Hub's anonymous pull limits.
    registry: cr.jaegertracing.io
  resources:
    limits:
      memory: 400Mi
  # Let the demo's Prometheus scrape the span metrics the spanmetrics connector
  # produces (port 8889 below), which is what powers the Monitor tab.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8889"

# Surface the Monitor tab in the UI.
uiconfig:
  monitor:
    menuEnabled: true

# Full v2 config. Adapted from the upstream reference for Service Performance
# Monitoring, cmd/jaeger/config-spm.yaml at v2.20.0, which is the shape the Jaeger
# docs point at for SPM with a Prometheus metrics backend.
#
# Note the flow: Jaeger receives spans over OTLP, stores them in memory, and the
# spanmetrics connector derives RED metrics from the same spans and exposes them
# on :8889 for Prometheus to scrape. jaeger_query then reads those metrics back
# out of Prometheus for the Monitor tab. In v1 only the read half was configured,
# so nothing ever produced the metrics and the tab stayed empty.
userconfig:
  service:
    extensions: [jaeger_storage, jaeger_query, healthcheckv2]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [jaeger_storage_exporter, span_metrics]
      metrics/spanmetrics:
        receivers: [span_metrics]
        exporters: [prometheus]
    telemetry:
      resource:
        service.name: jaeger
      metrics:
        level: detailed
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
      logs:
        level: info

  extensions:
    healthcheckv2:
      use_v2: true
      http:
        # The chart's liveness/readiness probes hit :13133/status. This has to bind
        # 0.0.0.0, not the default localhost, or the kubelet cannot reach it and the
        # pod never goes ready.
        endpoint: 0.0.0.0:13133

    jaeger_query:
      storage:
        traces: memstore
        metrics: metricstore
      ui:
        # The chart renders the `uiconfig` value above into a ConfigMap and mounts
        # it here, but nothing reads it unless the config points at the file.
        config_file: /etc/jaeger/ui-config.json

    jaeger_storage:
      backends:
        memstore:
          memory:
            max_traces: 5000
      metric_backends:
        metricstore:
          prometheus:
            endpoint: http://prometheus:9090
            # Prometheus exposes the counters as calls_total and
            # duration_milliseconds_bucket; without these Jaeger looks for
            # calls and duration_bucket and finds nothing.
            normalize_calls: true
            normalize_duration: true

  connectors:
    span_metrics:

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:

  exporters:
    jaeger_storage_exporter:
      trace_storage: memstore
    prometheus:
      endpoint: 0.0.0.0:8889
