alertmanager:
  enabled: false
configmapReload:
  prometheus:
    enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
server:
  fullnameOverride: prometheus
  extraFlags:
    - "enable-feature=exemplar-storage"
    - "web.enable-otlp-receiver"
    - "log.level=debug"
  tsdb:
    out_of_order_time_window: 30m
  persistentVolume:
    enabled: false
  service:
    servicePort: 9090
  resources:
    limits:
      # 300Mi was not enough: Prometheus holds ~69k active series here and was
      # OOMKilled every few hours (123 restarts in one run). It recovers each time, so
      # nothing looks broken -- it just loses its in-memory data, leaving gaps in the
      # dashboards.
      #
      # Most of that cardinality comes from the chart's default scrape jobs, which this
      # demo never queries: kubernetes-api-servers alone is ~36k series, plus ~16k from
      # the node/cadvisor jobs. The dashboards' metrics arrive by OTLP push from the
      # collector. Restricting scrape_configs to `kubernetes-pods` (needed for Jaeger's
      # :8889 span metrics) would cut ~80% of the series; not done here because a bad
      # override silently empties Jaeger's Monitor tab.
      memory: 1Gi
serverFiles:
  prometheus.yml:
    otlp:
      keep_identifying_resource_attributes: true
      promote_resource_attributes:
        - service.instance.id
        - service.name
        - service.namespace
        - cloud.availability_zone
        - cloud.region
        - container.name
        - deployment.environment.name
        - k8s.cluster.name
        - k8s.container.name
        - k8s.cronjob.name
        - k8s.daemonset.name
        - k8s.deployment.name
        - k8s.job.name
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.replicaset.name
        - k8s.statefulset.name
