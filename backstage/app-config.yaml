app:
  title: Scaffolded Backstage App
  baseUrl: http://localhost:3000

organization:
  name: Todo

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  auth:
    externalAccess:
      # The chat reaches the MCP actions endpoint over HTTP, so it needs
      # credentials even though it runs inside this same backend.
      # 01_start-demo.sh generates this token per run unless .env sets it.
      - type: static
        options:
          token: ${BACKSTAGE_MCP_TOKEN}
          subject: mcp-chat
  # Actions from these plugins are registered with the Actions Registry, which is
  # what plugin-mcp-actions-backend exposes as MCP tools.
  actions:
    pluginSources:
      - catalog
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection: ':memory:'
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest: {}

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options
  defaultAuthor:
    name: Scaffolder
    email: scaffolder@example.com
  defaultCommitMessage: 'Initial commit'

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    # Node.js Validation Service template
    - type: file
      target: ../../examples/nodejs-validation-template/template.yaml
      rules:
        - allow: [Template]

    # Infrastructure the services depend on. Registered statically because the
    # deploy scripts fix what exists -- unlike the services, there is nothing here
    # that appears or disappears while the demo is running.
    - type: file
      target: ../../../infrastructure/catalog-info.yaml
      rules:
        - allow: [Resource]

    # The services themselves are NOT listed here. They are discovered by the
    # scaffolded-services entity provider (packages/backend/src/catalog), which
    # scans services/*/catalog-info.yaml every 10 seconds. That is what lets a
    # service scaffolded during the demo show up without editing this file or
    # restarting the backend -- and disappear again when 02_cleanup.sh removes it.

    # Local example organizational data
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# Backstage's own actions, served as MCP tools at
# /api/mcp-actions/v1/<server key>.
mcpActions:
  # Must be false for a Claude provider. The default (true) prefixes the plugin id
  # with a dot -- `catalog.query-catalog-entities` -- and the Anthropic API rejects
  # the whole request with
  #   tools.<n>.custom.name: String should match pattern '^[a-zA-Z0-9_-]{1,128}$'
  # because a dot is not allowed in a tool name. That 400 breaks every chat message,
  # not just catalog questions, since the tool list is sent with each request.
  # With this off the tools arrive as `query-catalog-entities` etc., which do not
  # collide with Dash0's camelCase tool names.
  namespacedToolNames: false
  servers:
    catalog:
      name: 'Backstage Catalog'
      description: 'Read-only access to the software catalog'
      # The catalog registers six actions, two of which mutate the catalog:
      # register-entity (readOnly: false) and unregister-entity
      # (destructive: true). Only the read-only ones are exposed.
      #
      # `exclude` is evaluated before `include`, so it is the authoritative rule
      # -- a future catalog action that mutates is kept out even if it matches
      # the include glob. The filter also applies to tools/call, not just tool
      # discovery, so an excluded action cannot be invoked by name either.
      filter:
        include:
          - id: 'catalog:*'
            attributes:
              readOnly: true
        exclude:
          - attributes:
              readOnly: false
          - attributes:
              destructive: true

# Chat interface over MCP servers, used here to ask questions about the telemetry
# this demo produces. Secrets come from the repo-root .env, which 01_start-demo.sh
# exports before starting Backstage.
mcpChat:
  providers:
    # Only the first provider is used.
    - id: claude
      token: ${ANTHROPIC_API_KEY}
      model: claude-opus-5
  mcpServers:
    - id: dash0
      name: Dash0
      type: streamable-http
      url: ${DASH0_MCP_URL}
      headers:
        Authorization: Bearer ${DASH0_MCP_TOKEN}
    # Backstage's own catalog, via the mcpActions server defined above. Combining
    # the two servers is the point: the model can look up which components exist
    # and who owns them, then ask Dash0 how they are behaving.
    - id: backstage-catalog
      name: Backstage Catalog
      type: streamable-http
      url: http://localhost:7007/api/mcp-actions/v1/catalog
      headers:
        Authorization: Bearer ${BACKSTAGE_MCP_TOKEN}
      # Belt and braces. The mcpActions filter already withholds these two, but
      # disabledTools drops them at discovery here as well, so a change to that
      # filter cannot quietly hand the model a way to edit the catalog.
      # Unprefixed because mcpActions.namespacedToolNames is false.
      disabledTools:
        - register-entity
        - unregister-entity
  # Telemetry queries can be slower than the 60s default.
  toolCallTimeout: 120000
  systemPrompt: |
    You are an observability expert assistant with access to Dash0 tools for
    querying this demo's logs, spans, metrics and traces.

    Time ranges: you have no clock. Nothing in your context tells you the current
    date, so never write an absolute timestamp -- one guessed from training data
    can land months away from now and return an empty result that looks like a
    real "no data" answer.
    - Always use relative references, which Dash0 resolves against its own clock:
      from "now-15m" / "now-1h" / "now-24h", to "now".
    - Omitting timeRange entirely is also safe; it defaults to the last hour.
    - Only use an ISO 8601 timestamp (YYYY-MM-DDTHH:MM:SS.000Z) when the user
      supplies the date themselves, or when you are narrowing to a window you read
      out of an earlier tool result.

    When asked about system behaviour, performance or debugging:
    - Start with getServiceCatalog to see which services exist, then
      getServiceDetails for one of them.
    - Use getSpans and getTraceDetails for request flow, getLogRecords for logs,
      and getMetricCatalog plus getMetricQuery or promql for metrics.
    - Use getSpanCorrelations and getLogCorrelations to link findings together.

    The services in this demo are frontend, todo-service, notification-service and
    validation-service, running in the `default` namespace of a local kind cluster.

    Datasets: every Dash0 tool takes a `dataset` argument. Always pass `default`
    unless the user names a different one. Never leave the argument out, and never
    try to work out which dataset to use -- it is `default`.

    This account contains a dataset displayed as "OTel Demo" (technical id
    `dash0-demo`). Despite the name, it is a **different** application and holds none
    of this demo's data. Do not be tempted by it, and do not tell the user their
    telemetry is routed there. The same goes for `dash0-internal` and `claude`.

    You can always confirm you are in the right place: this demo's services are
    frontend, todo-service, notification-service and validation-service. If a query
    against `default` returns those, it is correct.

    Answer with concrete findings and cite the service, trace or metric you used.
    If the data does not support a conclusion, say so rather than guessing.

    The chat renders GitHub-flavored markdown, so use a table when comparing the
    same fields across several services, and headings, bold, inline code or
    fenced code blocks elsewhere.
