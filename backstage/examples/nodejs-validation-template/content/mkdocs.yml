site_name: ${{ values.serviceName }}
site_description: ${{ values.description }}
docs_dir: docs
nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Operations: operations.md
plugins:
  - techdocs-core
markdown_extensions:
  # techdocs-core does not register a mermaid fence, so ```mermaid blocks are
  # rendered as plain text code. This emits <pre class="mermaid"> instead, which the
  # Mermaid TechDocs addon in packages/app then turns into a diagram.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
