nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.4.1.cjs

# @backstage-community/plugin-mcp-chat renders assistant replies with
# react-markdown but never passes remarkPlugins, so markdown tables arrive in the
# chat as raw pipe characters even though the plugin already ships the CSS to
# style them. The patch in .yarn/patches adds remarkPlugins: [remarkGfm]; this
# extension supplies the dependency that patch imports.
#
# The dependency has to be declared here rather than inside the patch: Yarn
# resolves a `patch:` package's dependencies from the original npm manifest, so a
# dependency added by the patch itself is never installed.
#
# remark-gfm must be v4 -- the plugin resolves react-markdown 10, and v3 (which
# the hoisted copy is, via @backstage/core-components + react-markdown 8) targets
# the older unified/mdast generation.
packageExtensions:
  '@backstage-community/plugin-mcp-chat@*':
    dependencies:
      remark-gfm: ^4.0.0
