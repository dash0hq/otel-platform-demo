apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: notification-service
  description: Spring Boot notification service for sending notifications via RabbitMQ
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://app.dash0.com/goto/services/details?org=6517f2d8-1d85-41db-9450-f98f5e38294e&dataset=default&service_name=notification-service&from=now-1h&to=now
      title: Service details in Dash0
      icon: dash0
    - url: http://localhost:16686/search?service=notification-service&operation=all&lookback=1h
      title: Traces in Jaeger
      icon: trace
    - url: http://localhost:9090/graph?g0.expr=%7Bservice_name%3D%22notification-service%22%7D&g0.tab=1&g0.range_input=1h
      title: Metrics in Prometheus
      icon: chart
    - url: http://localhost:8000/projects/default/dashboards/notification-service
      title: Dashboard in Perses
      icon: dashboard
  tags:
    - spring-boot
spec:
  type: service
  lifecycle: experimental
  owner: notifications-team
  providesApis:
    - notification-api
  consumesApis:
    - rabbitmq-events
  dependsOn:
    - resource:default/mysql
    - resource:default/rabbitmq
    - resource:default/otel-collector

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: notification-api
  description: Notification service API
spec:
  type: asyncapi
  lifecycle: experimental
  owner: notifications-team
  definition: |
    asyncapi: 2.0.0
    info:
      title: Notification API
      version: 1.0.0
      description: Handles todo event notifications
    channels:
      todo-events:
        subscribe:
          summary: Subscribe to todo events
          message:
            payload:
              type: object
              properties:
                eventType:
                  type: string
                  enum: [created, deleted]
                todo:
                  type: object
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: rabbitmq-events
  description: RabbitMQ event bus for pub/sub messaging
spec:
  type: asyncapi
  lifecycle: experimental
  owner: notifications-team
  definition: |
    asyncapi: 2.0.0
    info:
      title: Todo Events Queue
      version: 1.0.0
    channels:
      todo-events:
        description: Todo lifecycle events
