apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: todo-service
  description: Spring Boot REST API for managing todos with a MySQL database
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://app.dash0.com/goto/services/details?org=6517f2d8-1d85-41db-9450-f98f5e38294e&dataset=default&service_name=todo-service&from=now-1h&to=now
      title: Service details in Dash0
      icon: dash0
    - url: http://localhost:16686/search?service=todo-service&operation=all&lookback=1h
      title: Traces in Jaeger
      icon: trace
    - url: http://localhost:9090/graph?g0.expr=%7Bservice_name%3D%22todo-service%22%7D&g0.tab=1&g0.range_input=1h
      title: Metrics in Prometheus
      icon: chart
  tags:
    - spring-boot
spec:
  type: service
  lifecycle: experimental
  owner: todo-team
  providesApis:
    - todo-api
    - rabbitmq-events
  dependsOn:
    - resource:default/mysql
    - resource:default/rabbitmq
    - component:default/validation-service
    - resource:default/otel-collector

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: todo-api
  description: REST API for todo management
spec:
  type: openapi
  lifecycle: experimental
  owner: todo-team
  definition: |
    openapi: 3.0.0
    info:
      title: Todo API
      version: 1.0.0
    paths:
      /todos:
        get:
          summary: Get all todos
          responses:
            '200':
              description: List of todos
        post:
          summary: Create a new todo
          responses:
            '201':
              description: Todo created
