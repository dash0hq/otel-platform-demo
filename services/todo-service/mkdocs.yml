site_name: todo-service
site_description: Spring Boot REST API for managing todos
docs_dir: docs
nav:
  - Overview: index.md
  - Architecture: architecture.md
  - API: api.md
  - Operations: operations.md
plugins:
  - techdocs-core
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format ''
